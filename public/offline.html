<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline - TechStar</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #020617; color: #e2e8f0; font-family: system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
    .card { text-align: center; max-width: 360px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.6; }
    button { margin-top: 16px; padding: 10px 20px; border: 0; border-radius: 12px; background: #4f46e5; color: #fff; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ইন্টারনেট সংযোগ নেই</h1>
    <p>সংযোগ ফিরে এলে আবার চেষ্টা করুন। Internet connection not available.</p>
    <button onclick="location.reload()">আবার চেষ্টা করুন</button>
  </div>
</body>
</html>
