<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)" />

  <!-- Outer Glow Ring -->
  <circle cx="250" cy="220" r="90" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.3" filter="url(#glow)" />

  <!-- Lightning / Star Icon -->
  <path d="M265 120 L185 240 H245 L235 320 L315 200 H255 Z" fill="url(#starGrad)" filter="url(#glow)" />
  <path d="M265 120 L185 240 H245 L235 320 L315 200 H255 Z" fill="#60a5fa" opacity="0.6" />

  <!-- Brand Text -->
  <text x="250" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">TECH<tspan fill="#3b82f6">STAR</tspan></text>
</svg>
